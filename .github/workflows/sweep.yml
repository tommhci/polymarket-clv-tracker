# Sustained sweep — deterministic scan coverage (FIXLOG Addendum 6).
#
# Measured reality (2026-08-29): GitHub dropped ~90% of the 30-min schedule
# events on this repo (2-4 actual fires/day against 48 scheduled), so the
# final-hour capture window before each EPL kickoff was missed for EVERY
# match on day one (capture rate 0% on 9 past markets). Widening cron grids
# only buys more lottery tickets; this workflow buys DETERMINISM instead:
# one schedule trigger per shift, then the job self-loops for ~5.5h at
# 25-min cadence (13 scans/shift) — GitHub drops schedule *events*, it does
# not interrupt a running job.
#
# Shift times chosen against the EPL kickoff distribution (10:30–20:00 UTC
# for UK Sat/Mon cards; 19:45 UTC midweek evenings):
#   10:07 UTC → scans ~10:07–15:37  (covers 11:30 / 14:00 / 15:00 kickoffs)
#   17:07 UTC → scans ~17:07–21:37  (covers 17:30 / 19:45 / 20:00 kickoffs)
#
# Inside the loop main.py's SmartScheduler still gates full scans; with
# POLYMARKET_SWEEP=1 a "skip" degrades to a light price-only scan so the
# time series stays dense. Light scans skip the Odds API baseline entirely
# and full scans are throttled to one fetch per sport per 6h — the quota
# math only closes with BOTH mechanisms in place.

name: Sustained Sweep

on:
  schedule:
    - cron: '7 10 * * *'
    - cron: '7 17 * * *'
  workflow_dispatch:  # manual trigger for testing/repair

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # hard ceiling; job self-limits to ~5.6h
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sweep (13 scans at 25-min cadence)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYMARKET_SWEEP: '1'
        run: |
          for i in $(seq 1 13); do
            echo "── sweep scan $i/13 ($(date -u +'%H:%M UTC')) ──"
            python main.py || true   # one failed iteration must not kill the shift
            if [ "$i" -lt 13 ]; then sleep 1500; fi
          done

      - name: Export dashboard + status
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python main.py --report
          python -c "import dashboard; dashboard.export_all()"

      - name: Commit sweep data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.csv docs/scans.csv docs/paper_trades.csv docs/odds_state.json STATUS.md || true
          git diff --cached --quiet || {
            git commit -m "data: sweep $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -q origin main || true
            git push || true
          }

      - name: Dead-man's switch — alert on silent pipeline death
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python alerts.py --stale --threshold-h 48
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet STATUS.md || (
            git add STATUS.md &&
            git commit -m "alert: pipeline stale banner (auto)" &&
            git pull --rebase -q origin main || true &&
            git push || true
          )
