# Polymarket CLV Scanner — Automated cloud execution via GitHub Actions
# Runs every 30 minutes. Runtime state stays out of the public repository.
# Free tier: 2000 min/month → this uses ~720 min/month (well within limit).

name: Polymarket Scan

on:
  schedule:
    # Every 15 min. MEASURED (Addendum 6, 2026-08-29): GitHub dropped ~90% of
    # the previous 30-min schedule events (run history: 2-4 actual fires/day
    # against 48 scheduled), which is exactly why the first EPL capture-rate
    # reading was 0% — no run ever landed inside a final-hour window. More
    # off-peak slots = more surviving lottery tickets; skip-runs cost <2s.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:  # Manual trigger (always runs full scan regardless of scheduler)

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write   # dead-man's switch opens/closes the stale-pipeline issue
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: football-data.org health check (P1 — FIXLOG.md)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python -c "
          from news_fetcher import check_football_data_health
          ok, msg = check_football_data_health()
          print(('✅ ' if ok else '⚠️  ') + msg)
          if not ok:
              print('⚠️  Continuing anyway — scanner.py falls back to the old '
                    'shared-endDateIso behavior per advancement-market team '
                    'when football-data.org is unavailable (degraded, not fatal). '
                    'See FIXLOG.md \"P1\".')
          "
        continue-on-error: true
        # Intentionally non-blocking: a transient football-data.org outage
        # should not stop the whole cron run (Polymarket price collection is
        # still valuable on its own). scanner.py already degrades gracefully
        # per-team when this lookup is unavailable. This step exists purely
        # to make key failures VISIBLE in the Actions log instead of silent.

      - name: Run scanner + generate status report
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow_dispatch run — forcing a full scan regardless of the scheduler."
            FORCE_FLAG="--force"
          fi
          python main.py $FORCE_FLAG
          python main.py --report
          python -c "import dashboard; dashboard.export_all()"

      - name: Commit updated CSV data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data.csv docs/scans.csv docs/paper_trades.csv docs/odds_state.json STATUS.md || true
          git diff --cached --quiet || git commit -m "data: scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true

      # ── Dead-man's switch (FIXLOG Addendum 5) ──────────────────────────────
      # This pipeline died silently once (Jul-Aug 2026: cron ran, zero markets,
      # two months of no rows). `if: always()` makes the check fire even when
      # the scan step failed; a stale STATUS banner is committed, which also
      # counts as repo activity and defers GitHub's 60-day schedule disable.
      # Advisory only — never fails the workflow. The second-order blind spot
      # (workflow stops running ENTIRELY) is covered by GitHub's own
      # "scheduled workflow disabled" email after 60 days + weekly review.
      - name: Dead-man's switch — alert on silent pipeline death
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python alerts.py --stale --threshold-h 48
          # The stale banner must be COMMITTED, not just written: it only
          # exists in the runner workspace otherwise (Addendum 6 fix), and
          # the commit itself defers GitHub's 60-day schedule disable.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet STATUS.md || (
            git add STATUS.md &&
            git commit -m "alert: pipeline stale banner (auto)" &&
            git pull --rebase -q origin main || true &&
            git push || true
          )
